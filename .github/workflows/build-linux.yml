name: Build (Linux)
on:
  workflow_call:
jobs:
  build:
    name: Linux
    runs-on: ubuntu-latest
    steps:
    - name: Check out repository
      uses: actions/checkout@v7
    - name: Install System Packages
      run: |
        sudo apt-get update
        sudo apt-get install -y qt6-base-dev
    - name: Lint
      run: cargo clippy --workspace -- -D warnings
    - name: Build examples
      run: cargo build --examples
